name: ScopeShift verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          enable-cache: true
      - run: uv python install 3.12.16
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest --cov=scopeshift --cov-report=xml
      - run: uv run scopeshift demo --output artifacts/ci-demo
      - run: uv build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence
          path: |
            artifacts/ci-demo
            coverage.xml
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose run --build --rm verify
      - run: docker compose run --rm demo
