services:
  demo:
    image: scopeshift:local
    build: .
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    tmpfs:
      - /tmp:mode=1777,size=512m
    command: [demo, --output, /tmp/demo]
  verify:
    image: scopeshift:local
    build: .
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    working_dir: /app
    tmpfs:
      - /tmp:mode=1777,size=512m
    entrypoint: [/app/.venv/bin/python, -m, pytest]
    command: [-q, -p, 'no:cacheprovider']
