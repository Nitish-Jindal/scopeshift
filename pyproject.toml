[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "scopeshift"
version = "0.1.0"
description = "Temporal authorization consistency benchmark for MCP-enabled agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=1.20,<2", "pydantic>=2.10,<3", "hypothesis>=6.130,<7", "inspect-ai>=0.3.100,<0.4", "matplotlib>=3.9,<4"]

[project.scripts]
scopeshift = "scopeshift.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/scopeshift"]

[tool.hatch.build.targets.wheel.force-include]
"scenarios/dataset.json" = "scopeshift/data/dataset.json"
"tests/oracle/fixtures.json" = "scopeshift/data/fixtures.json"
